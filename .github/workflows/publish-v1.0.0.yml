name: Publish NYSE Market Pulse v1.0.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.0.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-first-stable-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out verified source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all unit and dashboard tests
        run: python -m pytest -q
      - name: Verify Python code compiles
        run: python -m compileall -q app.py marketpulse scripts
      - name: Publish v1.0.0 release from this tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v1.0.0 already exists. No duplicate release will be created.'
            exit 0
          fi
          test -s RELEASE_NOTES_v1.0.0.md
          gh release create v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'NYSE Market Pulse v1.0.0 — Live Market Analytics Dashboard' \
            --notes-file RELEASE_NOTES_v1.0.0.md \
            --latest
          gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" --json name,tagName,isDraft,isPrerelease,url --jq '.'
