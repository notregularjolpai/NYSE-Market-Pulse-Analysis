name: Python tests and offline demonstration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install packages
        run: python -m pip install -r requirements.txt
      - name: Unit tests (offline, synthetic data)
        run: python -m pytest -q
      - name: Run synthetic demo (no network requests)
        run: python scripts/run_analysis.py --demo
      - name: Attach preview outputs
        uses: actions/upload-artifact@v4
        with:
          name: nyse-market-pulse-synthetic-demo
          path: outputs/demo/
